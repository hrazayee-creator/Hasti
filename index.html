 const cards=P.map((q,i)=>{const st=stepsOf(q);return`<div class="card pcs"><b>قطعه ${fa(i+1)} — ${q.name}</b><br><small>برش: ${D(q.cut)}</small>${svgS(q,st.length-1,wm)}<details><summary>متن مرحله‌ها (اختیاری)</summary>${st.map((s,j)=>`<div class="stp"><i>${fa(j+1)}</i><span>${D(s.t)}</span></div>`).join('')}</details></div>`}).join('');
 modal(`<h3>${p.g=='m'?'👔':'👗'} الگوی ${p.m} ${gn} — ${esc(p.c||'')}</h3><small>${dstr(p.d)} · ${fa(P.length)} قطعه</small>${p.t?`<p>${esc(p.t)}</p>`:''}<button class="pri" style="font-size:17px;padding:15px" onclick="gstart()">🎧 شروع آموزش گام‌به‌گام رسم الگو</button><div class="btns" style="margin:8px 0"><button onclick="print()">چاپ / PDF</button></div>${ck.W.length?`<div class="tot" style="border-color:#f0a43a">${ck.W.map(e=>'⚠ '+e).join('<br>')}</div>`:''}<div class="tot"><b style="font-size:14px">اندازه‌های وارد‌شده (سانتی‌متر)</b>${p.f.map(x=>x[0]+': '+fa(x[1])).join('، ')}${df.length?`<br><small>اندازه‌های خالی با مقدار پیش‌فرض محاسبه شد: ${df.map(x=>x[0]+' '+fa(x[1])).join('، ')}</small>`:''}<br>پارچه‌ی موردنیاز (تقریبی، عرض ۱۴۰): <b style="display:inline">${fa(fab.toFixed(1).replace('.','٫'))} متر</b></div><h3>شکل نهایی قطعه‌ها</h3><small>ناحیه‌ی صورتی = ۱ سانتی‌متر جا‌دوخت · عدد روی لبه‌ها = طول همان لبه</small>${cards}<h3>🖼 شکل لباس بعد از دوخت</h3>${sk}<small>طرح تقریبی لباس دوخته‌شده با همین اندازه‌ها و سبک «${esc(p.s||STY[p.m][0])}» است (عکس واقعی نیست).</small><div class="btns" style="margin-top:10px"><button onclick="cls()">بستن</button></div><div class="card" id="ph"><h3>📷 عکس نمونه‌ی واقعی</h3><small>در حال دریافت از اینترنت…</small></div><small>الگو بر پایه‌ی فرمول‌های استاندارد است؛ قبل از برش پارچه‌ی اصلی، روی پارچه‌ی ارزان نمونه بدوزید.</small>`);loadPhotos(p)}catch(e){toast('خطا در ساخت الگو: '+e.message)}}
const PQ={'شلوار':{'راسته':'straight leg trousers','دمپا':'bootcut flared trousers','تنگ':'skinny trousers','گشاد':'wide leg trousers'},'شلوارک':{'راسته':'shorts clothing'},'دامن':{'راسته':'pencil skirt','ای‌لاین':'A-line skirt','کلوش':'circle skirt','چین‌دار':'pleated skirt'},'مانتو':{'ساده':'Iranian manteau coat','کلوش':'flared coat women'},'تونیک':{'ساده':'tunic top women','کلوش':'flared tunic'},'پیراهن':{'یقه‌دار':'collared dress shirt','یقه گرد':'round neck shirt'},'بلوز و تیشرت':{'یقه گرد':'women blouse','یقه هفت':'v-neck blouse'},'تاپ':{'یقه گرد':'tank top women','یقه هفت':'v-neck tank top'},'تیشرت':{'یقه گرد':'crew neck t-shirt','یقه هفت':'v-neck t-shirt'},'جلیقه':{'یقه هفت':'waistcoat vest','یقه گرد':'vest top'},'کلاه':{'لبه‌دار':'brimmed hat','بدون لبه':'beanie hat'}};
async function loadPhotos(p){const e=$('#ph');if(!e)return;const sty=p.s||STY[p.m][0],q=(PQ[p.m]||{})[sty]||p.m,gq='https://www.google.com/search?tbm=isch&q='+encodeURIComponent('مدل '+p.m+' '+sty+(p.g=='m'?' مردانه':' زنانه')),more=`<a href="${gq}" target="_blank" rel="noopener" style="display:block;margin-top:8px;color:var(--p)">🔎 دیدن عکس‌های بیشتر این مدل در گوگل</a>`;
 try{const r=await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=320&gsrsearch='+encodeURIComponent(q+' filetype:bitmap')),j=await r.json(),pg=Object.values((j.query||{}).pages||{}).sort((a,b)=>a.index-b.index).filter(x=>x.imageinfo&&x.imageinfo[0].thumburl).slice(0,4);
  if(!pg.length)throw 0;e.innerHTML=`<h3>📷 عکس نمونه‌ی واقعی</h3><small>برای دیدن ظاهر کلی «${p.m} ${sty}» (از Wikimedia Commons؛ لزوماً دقیقاً همین الگو نیست)</small><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">${pg.map(x=>{const i=x.imageinfo[0],l=(i.extmetadata||{}).LicenseShortName;return`<a href="${i.descriptionurl}" target="_blank" rel="noopener" style="width:calc(50% - 4px)"><img src="${i.thumburl}" loading="lazy" alt="" style="width:100%;height:150px;object-fit:cover;border-radius:12px;margin:0"><small style="color:var(--m)">${l?esc(l.value||''):'منبع'}</small></a>`}).join('')}</div>${more}`}
 catch(x){e.innerHTML=`<h3>📷 عکس نمونه‌ی واقعی</h3><small>برای دیدن عکس‌ها باید به اینترنت وصل باشید.</small>${more}`}}

/* صدا: فقط وقتی گوشی صدای فارسی داشته باشد */
const faV=()=>{try{return speechSynthesis.getVoices().find(x=>/^(fa|per)/i.test(x.lang))||null}catch(e){return null}};
function tts(t,cb){const v=faV();if(!v){cb&&cb();return}const u=new SpeechSynthesisUtterance(t);u.lang=v.lang.replace('_','-');u.voice=v;u.rate=rate;let d=0,wd;const fin=()=>{if(!d){d=1;clearTimeout(wd);cb&&cb()}};wd=setTimeout(fin,Math.max(4000,t.length*150+3000));u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)}
const vlab=()=>faV()?'🔊 صدای فارسی گوشی فعال است':'ℹ️ روی این گوشی صدای فارسی نصب نیست؛ آموزش فقط نوشتاری است.';
function vtest(){if(!faV())return alert('روی این گوشی صدای فارسی نصب نیست، پس خواندن صوتی کار نمی‌کند. برای استفاده، در تنظیمات گوشی ← تبدیل متن به گفتار، یک موتور گفتار با زبان فارسی نصب کنید.');stopS();tts('یک خط عمودی به طول بیست و پنج سانتی‌متر بکشید.')}
let gfin=0,G=null,gi=0,gj=0,gauto=15,gtok=0,gpaused=0,gtimer=0;
function stopS(){gtok++;try{speechSynthesis.cancel()}catch(e){}}
function speakQ(a,cb){stopS();const my=gtok;let i=0;const nx=()=>{if(my!=gtok)return;if(i>=a.length)return cb&&cb();tts(a[i++],nx)};setTimeout(nx,200)}
const gtot=()=>G.reduce((a,x)=>a+x.st.length,0);
function gstart(){if(!faV())gauto=0;G=CUR.P.map(q=>({q,st:stepsOf(q)}));gi=0;gj=0;gfin=0;gpaused=0;$('#gd').style.display='block';gshow();gsay()}
function gshow(){const{q,st}=G[gi],dn=G.slice(0,gi).reduce((a,x)=>a+x.st.length,0)+gj+1,op=(arr,v)=>arr.map(a=>`<option value="${a[0]}" ${v==a[0]?'selected':''}>${a[1]}</option>`).join('');
 $('#gd').scrollTop=0;$('#gd').innerHTML=`<div class="gw"><div class="gt"><button onclick="gclose()" style="width:42px;height:42px;padding:0;border-radius:50%">✕</button><div style="flex:1"><b>قطعه ${fa(gi+1)} از ${fa(G.length)} — ${q.name}</b><br><small>مرحله ${fa(gj+1)} از ${fa(st.length)} · برش: ${D(q.cut)}</small></div></div><div class="gp"><i style="width:${dn/gtot()*100}%"></i></div>${svgS(q,gj,0)}<div class="gs">${D(st[gj].t)}</div><div class="gc"><button onclick="gnav(-1)">⏮ قبلی</button><button onclick="gsay()">🔁 تکرار</button><button onclick="gpause()">${gpaused?'▶ ادامه':'⏸ توقف'}</button><button class="pri" style="margin:0" onclick="gnav(1)">بعدی ⏭</button></div><div class="fl" style="margin-top:10px"><div><label>رفتن خودکار به مرحله‌ی بعد</label><select onchange="gauto=+this.value">${op([[0,'دستی'],[8,'بعد از ۸ ثانیه'],[15,'بعد از ۱۵ ثانیه'],[30,'بعد از ۳۰ ثانیه']],gauto)}</select></div></div>${gfin&&CUR.sk?'<div class="card" style="margin-top:10px"><h3>🖼 شکل لباس بعد از دوخت</h3>'+CUR.sk+'</div>':''}<div class="tot" style="margin-top:10px"><small>${vlab()}</small></div></div>`}
function gsay(){clearTimeout(gtimer);const{q,st}=G[gi],a=[];if(gj==0)a.push(Sp(`قطعه‌ی ‹${gi+1}›، ${q.name}. برش: ${q.cut}.`));a.push(Sp(st[gj].t));gpaused=0;speakQ(a,()=>{if(gauto>0&&!gpaused)gtimer=setTimeout(()=>gnav(1),gauto*1000)})}
function gnav(d){clearTimeout(gtimer);stopS();gj+=d;if(gj>=G[gi].st.length){gi++;gj=0}else if(gj<0){gi--;if(gi<0){gi=0;gj=0}else gj=G[gi].st.length-1}
 if(gi>=G.length){gi=G.length-1;gj=G[gi].st.length-1;gfin=1;gshow();toast('الگو تمام شد 🎉');return speakQ(['الگو تمام شد. دستتان درد نکند.'])}
 gshow();gsay()}
function gpause(){if(gpaused){gsay()}else{gpaused=1;clearTimeout(gtimer);stopS()}gshow()}
function gclose(){stopS();clearTimeout(gtimer);$('#gd').style.display='none'}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
addEventListener('error',e=>toast('خطا: '+(e.message||'')));

function sayT(q,t){if(!faV())return toast('صدای فارسی روی این گوشی نصب نیست');speakQ(['جمع تعداد '+words(q)+' عدد.','مبلغ کل '+words(Math.round(t/10))+' تومان.'])}
/* پشتیبان */
const idb=(m,k,v)=>new Promise(r=>{const q=indexedDB.open('hestia',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>{const s=q.result.transaction('s',m=='get'?'readonly':'readwrite').objectStore('s'),x=m=='get'?s.get(k):s.put(v,k);x.onsuccess=()=>r(x.result);x.onerror=()=>r()};q.onerror=()=>r()});
const dump=()=>JSON.stringify({app:'hestia',t:new Date().toISOString(),data:db});
const bname=()=>'hestia-'+now().join('-')+'-'+new Date().toTimeString().slice(0,5).replace(':','')+'.json';
function keep(){const j=dump();try{localStorage.auto=j;localStorage.autoT=new Date().toLocaleString('fa-IR')}catch(e){}return j}
async function toDir(j,n){try{const h=await idb('get','dir');if(!h)return false;let p=await h.queryPermission({mode:'readwrite'});if(p!='granted')p=await h.requestPermission({mode:'readwrite'});if(p!='granted')return false;const w=await(await h.getFileHandle(n,{create:true})).createWritable();await w.write(j);await w.close();return h.name}catch(e){return false}}
function dl(j,n){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=n;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000)}
async function backup(){const j=keep(),n=bname(),d=await toDir(j,n);if(!d)dl(j,n);localStorage.fileT=Date.now();toast(d?'در پوشه‌ی «'+d+'» ذخیره شد':'فایل پشتیبان در پوشه‌ی دانلودها ذخیره شد');return d?'پوشه‌ی '+d:'پوشه‌ی دانلودها'}
async function pick(){try{const h=await showDirectoryPicker({mode:'readwrite'});await idb('put','dir',h);toast('پوشه تعریف شد: '+h.name);rB()}catch(e){if(e.name!='AbortError')toast('انتخاب پوشه ممکن نشد')}}
function restore(j){try{const d=JSON.parse(j).data;if(!d||!d.orders)throw 0;if(!confirm('اطلاعات فعلی با این پشتیبان جایگزین شود؟'))return;db=Object.assign({orders:[],pats:[],nt:[],lock:null,seq:1},d);save();toast('اطلاعات بازیابی شد ✓');go('d')}catch(e){toast('فایل پشتیبان معتبر نیست')}}
function rfile(e){const f=e.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(r.result);r.onerror=()=>toast('خواندن فایل ممکن نشد');r.readAsText(f);e.value=''}
function rB(){$('#v').innerHTML=`<div class="card"><h3>🔍 اندازه‌ی نمایش صفحه</h3><p style="color:var(--m);font-size:14px;margin:0 0 8px">اگر صفحه در گوشی بزرگ یا کوچک است، همین‌جا تنظیم کنید.</p><div class="seg">${[[.8,'کوچک'],[.9,'متوسط'],[1,'عادی'],[1.1,'بزرگ']].map(x=>`<button class="${ZM()==x[0]?'on':''}" onclick="setZ(${x[0]});rB()">${x[1]}</button>`).join('')}</div></div><div class="card"><h3>🔊 صدای آموزش</h3><p style="color:var(--m);font-size:14px;margin:0 0 8px">${vlab()}</p><button style="width:100%" onclick="vtest()">🔈 تست صدا</button></div><div class="card"><h3>پشتیبان‌گیری</h3><button class="pri" onclick="backup()">💾 پشتیبان‌گیری همین حالا</button><p style="color:var(--m);font-size:14px">آخرین نسخه‌ی داخل برنامه: ${localStorage.autoT||'هنوز نیست'}<br>آخرین فایل پشتیبان: ${localStorage.fileT?new Date(+localStorage.fileT).toLocaleString('fa-IR'):'هنوز نیست'}</p>${window.showDirectoryPicker?`<button style="width:100%" onclick="pick()">📁 انتخاب پوشه‌ی پشتیبان</button><p id="fn" style="font-size:13px;color:var(--m)"></p>`:'<p style="color:var(--m);font-size:14px">فایل پشتیبان در پوشه‌ی «دانلودها» ذخیره می‌شود.</p>'}<label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" style="width:22px;height:22px;margin:0;accent-color:var(--p)" ${db.ax!==0?'checked':''} onchange="db.ax=this.checked?1:0;save()"> هنگام خروج، فایل پشتیبان ساخته شود</label></div><div class="card"><h3>بازیابی</h3><button style="width:100%;margin-bottom:8px" onclick="$('#rf').click()">📂 انتخاب فایل پشتیبان</button><input type="file" id="rf" hidden onchange="rfile(this)"><button style="width:100%" onclick="localStorage.auto?restore(localStorage.auto):toast('نسخه‌ی داخلی نیست')">بازیابی از آخرین نسخه‌ی داخل برنامه</button></div><div class="card"><h3>امنیت</h3><button class="pri" onclick="lockT()">${db.lock?'غیرفعال کردن قفل اثر انگشت':'فعال کردن قفل اثر انگشت'}</button></div><div class="card"><button class="pri" style="background:linear-gradient(135deg,#c0264f,#e0566f)" onclick="exitApp()"><svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align:-3px;margin-inline-end:4px" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>خروج از برنامه</button></div>`;if(window.showDirectoryPicker)idb('get','dir').then(h=>{if(h&&$('#fn'))$('#fn').textContent='پوشه‌ی انتخاب‌شده: '+h.name})}
async function exitApp(){if(!confirm('از برنامه خارج می‌شوید؟ قبل از خروج پشتیبان گرفته می‌شود.'))return;let w='حافظه‌ی داخلی برنامه';try{if(db.ax!==0)w=await backup();else keep()}catch(e){keep()}stopS();$('#ex span').textContent='پشتیبان در '+w+' ذخیره شد. اگر برنامه خودش بسته نشد، دکمه‌ی خانه‌ی گوشی را بزنید.';$('#ex').style.display='flex';setTimeout(()=>{try{window.close()}catch(e){}try{window.open('','_self');window.close()}catch(e){}},900)}
addEventListener('pagehide',keep);document.addEventListener('visibilitychange',()=>{if(document.hidden)keep();else if(db.lock)lockUI()});
if(db.orders.length&&(!localStorage.fileT||Date.now()-localStorage.fileT>3*864e5))setTimeout(()=>toast('مدتی است فایل پشتیبان نگرفته‌اید'),1800);
/* اثر انگشت */
const rnd=n=>crypto.getRandomValues(new Uint8Array(n)),b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function lockT(){if(db.lock){if(await auth(true)){db.lock=null;save();toast('قفل غیرفعال شد');rB()}return}
 try{const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Dookht Hestia'},user:{id:rnd(16),name:'hestia',displayName:'هستیا'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});db.lock=b64(c.rawId);save();toast('قفل اثر انگشت فعال شد');rB()}catch(e){toast('این دستگاه اثر انگشت را پشتیبانی نمی‌کند')}}
async function auth(quiet){try{await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:ub(db.lock)}],userVerification:'required',timeout:60000}});if(!quiet)$('#lock').style.display='none';return true}catch(e){if(!quiet)toast('تأیید نشد، دوباره تلاش کنید');return false}}
function lockUI(){$('#lock').style.display='flex';auth()}
if(db.lock)lockUI();
go('d');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
